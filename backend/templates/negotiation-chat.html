<body class="bg-surface text-on-surface">
<style>
  #app-loader{position:fixed;inset:0;z-index:9999;background:#131b2e;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .4s ease,visibility .4s ease;}
  #app-loader.app-loader-hidden{opacity:0;visibility:hidden;pointer-events:none;}
  #app-loader .loader-badge{width:72px;height:72px;border-radius:50%;animation:loader-pulse 1.6s ease-in-out infinite;}
  #app-loader .loader-name{margin-top:20px;font-family:'Geist',sans-serif;font-weight:700;font-size:22px;color:#ffffff;letter-spacing:-0.01em;}
  #app-loader .loader-tag{margin-top:6px;font-family:'Geist',sans-serif;font-size:11px;letter-spacing:.18em;color:#fea619;text-transform:uppercase;}
  #app-loader .loader-track{width:160px;height:3px;background:rgba(255,255,255,.15);overflow:hidden;border-radius:2px;margin-top:22px;}
  #app-loader .loader-fill{width:40%;height:100%;background:#fea619;border-radius:2px;animation:loader-slide 1.2s ease-in-out infinite;}
  @keyframes loader-slide{0%{transform:translateX(-100%);}50%{transform:translateX(60%);}100%{transform:translateX(220%);}}
  @keyframes loader-pulse{0%,100%{opacity:1;}50%{opacity:.75;}}
</style>
<div id="app-loader">
<img alt="Logistica" class="loader-badge" src="/static/img/logo-mark.svg"/>
<div class="loader-name">Logistica</div>
<div class="loader-tag">Loading</div>
<div class="loader-track"><div class="loader-fill"></div></div>
</div>

<!-- Top Navigation -->
<!-- Main Content Grid -->
<main class="pt-16 h-screen overflow-hidden">
<div class="flex h-full">
<!-- Left Pane: Chat Thread -->
<section class="flex-grow flex flex-col bg-surface border-r border-outline-variant">
<!-- Chat Header -->
<div class="px-6 py-4 border-b border-outline-variant flex justify-between items-center bg-surface-container-lowest">
<div class="flex items-center gap-4">
<div class="relative">
<div class="w-10 h-10 rounded-full border border-outline-variant bg-surface-container-high flex items-center justify-center">
<span class="material-symbols-outlined text-outline">person</span>
</div>
</div>
<div>
<h3 class="text-label-md font-label-md text-on-surface" id="counterparty-name">Loading…</h3>
<p class="text-label-sm font-label-sm text-on-surface-variant flex items-center gap-1" id="delivery-ref">—</p>
</div>
</div>
<div class="flex gap-2">
<button class="p-2 hover:bg-surface-container-high rounded transition-colors text-on-surface-variant" onclick="window.location.href='live-tracking?id=' + deliveryId">
<span class="material-symbols-outlined">local_shipping</span>
</button>
</div>
</div>
<!-- Chat Body -->
<div class="flex-grow overflow-y-auto p-6 flex flex-col gap-6 chat-scrollbar bg-[#fcfdff]" id="chat-body">
<div class="flex justify-center text-on-surface-variant text-label-sm">Loading conversation…</div>
</div>
<!-- Chat Input Area -->
<div class="p-4 border-t border-outline-variant bg-surface-container-lowest">
<div class="flex items-end gap-3">
<button class="p-2 text-on-surface-variant hover:text-primary transition-colors" onclick="proposeRate()" title="Propose a new rate">
<span class="material-symbols-outlined">request_quote</span>
</button>
<div class="flex-grow relative">
<textarea class="w-full bg-surface border border-outline-variant p-3 pr-12 focus:ring-2 focus:ring-primary/10 focus:border-primary outline-none transition-all resize-none text-body-sm font-body-sm min-h-[48px] max-h-32 rounded-lg" id="message-input" placeholder="Type your message or negotiate terms..." rows="1"></textarea>
</div>
<button class="w-12 h-12 bg-primary text-white flex items-center justify-center hover:bg-primary/90 transition-all active:scale-95 shrink-0" id="send-btn">
<span class="material-symbols-outlined">send</span>
</button>
</div>
</div>
</section>
<!-- Right Pane: Delivery Summary -->
<section class="hidden xl:flex w-96 flex-col bg-surface-container-low border-l border-outline-variant">
<div class="p-6 border-b border-outline-variant">
<h2 class="text-headline-md font-headline-md text-primary mb-1">Delivery Summary</h2>
<p class="text-label-sm font-label-sm text-on-surface-variant">Order ID: <span class="font-mono-sm text-primary" id="summary-ref">—</span></p>
</div>
<div class="flex-grow overflow-y-auto p-6 flex flex-col gap-8 chat-scrollbar">
<!-- Route Visual -->
<div class="flex flex-col gap-4">
<div class="flex items-start gap-4">
<div class="flex flex-col items-center gap-1">
<span class="material-symbols-outlined text-primary text-[20px]">location_on</span>
<div class="w-0.5 h-12 bg-outline-variant border-dashed border-l"></div>
<span class="material-symbols-outlined text-secondary text-[20px]">near_me</span>
</div>
<div class="flex flex-col gap-10">
<div>
<p class="text-label-sm font-label-sm text-outline uppercase tracking-wider">Origin</p>
<p class="text-label-md font-label-md text-on-surface" id="summary-origin">—</p>
</div>
<div>
<p class="text-label-sm font-label-sm text-outline uppercase tracking-wider">Destination</p>
<p class="text-label-md font-label-md text-on-surface" id="summary-dest">—</p>
</div>
</div>
</div>
</div>
<!-- Cargo Details Card -->
<div class="bg-surface border border-outline-variant p-4 rounded-lg">
<div class="flex items-center gap-2 mb-4">
<span class="material-symbols-outlined text-on-surface-variant">inventory_2</span>
<h4 class="text-label-md font-label-md text-on-surface">Shipment Inventory</h4>
</div>
<div class="flex flex-col gap-3">
<div class="flex justify-between text-label-sm font-label-sm">
<span class="text-on-surface-variant">Cargo Type</span>
<span class="text-on-surface" id="summary-cargo">—</span>
</div>
<div class="flex justify-between text-label-sm font-label-sm">
<span class="text-on-surface-variant">Total Weight</span>
<span class="text-on-surface" id="summary-weight">—</span>
</div>
<div class="flex justify-between text-label-sm font-label-sm">
<span class="text-on-surface-variant">Target Price</span>
<span class="text-on-surface" id="summary-price">—</span>
</div>
</div>
</div>
<!-- Status Timeline -->
<div class="flex flex-col gap-4">
<h4 class="text-label-md font-label-md text-on-surface">Event Log</h4>
<div class="flex flex-col gap-4 relative" id="event-log"></div>
</div>
</div>
<!-- Footer Action -->
<div class="p-6 border-t border-outline-variant bg-surface-container">
<button class="w-full py-3 bg-primary text-white text-label-md font-label-md flex items-center justify-center gap-2 hover:opacity-90 transition-opacity" onclick="window.location.href='live-tracking?id=' + deliveryId">
<span class="material-symbols-outlined text-[20px]">local_shipping</span>
                        View Live Tracking
                    </button>
</div>
</section>
</div>
</main>
<!-- Floating Action for Quick Templates (Contextual Suppression Handled) -->
<div class="fixed bottom-6 right-6 flex flex-col gap-3 lg:hidden">
<button class="w-14 h-14 bg-secondary-container text-on-secondary-container shadow-xl flex items-center justify-center">
<span class="material-symbols-outlined">description</span>
</button>
</div>
<script>
        // Micro-interaction for Textarea Auto-resize
        const textarea = document.getElementById('message-input');
        textarea.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });
    </script>
    <script src="/static/js/config.js"></script>
    <script src="/static/js/api.js"></script>
    <script src="/static/js/auth.js"></script>
    <script src="/static/js/ui.js"></script>
    <script>
        const user = requireAuth();
        renderAppShell(user.role === 'driver' ? 'driver-dashboard' : 'customer-dashboard', { title: 'Negotiation' });

        const deliveryId = qs('id');
        let delivery = null;

        function renderEventLog() {
            const log = document.getElementById('event-log');
            const events = delivery.status_events || [];
            log.innerHTML = `<div class="absolute left-2.5 top-2 bottom-2 w-px bg-outline-variant"></div>` + events
                .slice()
                .reverse()
                .map((e, i) => `
                <div class="flex gap-4 relative ${i > 0 ? 'opacity-60' : ''}">
                  <div class="w-5 h-5 rounded-full ${i === 0 ? 'bg-secondary' : 'bg-primary'} border-4 border-surface z-10"></div>
                  <div>
                    <p class="text-label-sm font-label-sm text-on-surface font-semibold">${e.status.replace(/_/g, ' ')}</p>
                    ${e.note ? `<p class="text-label-sm font-label-sm text-outline">${e.note}</p>` : ''}
                    <p class="text-label-sm font-label-sm text-outline mt-1 italic">${dateTime(e.created_at)}</p>
                  </div>
                </div>`)
                .join('');
        }

        function renderSummary() {
            document.getElementById('summary-ref').textContent = delivery.reference;
            document.getElementById('summary-origin').textContent = delivery.pickup_address;
            document.getElementById('summary-dest').textContent = delivery.dropoff_address;
            document.getElementById('summary-cargo').textContent = delivery.package_type.replace(/_/g, ' ');
            document.getElementById('summary-weight').textContent = `${delivery.weight_kg} kg`;
            document.getElementById('summary-price').textContent = money(delivery.final_price || delivery.target_price);
            document.getElementById('delivery-ref').textContent = delivery.reference;
            renderEventLog();

            const isCustomer = user.role === 'customer' && delivery.customer.id === user.id;
            const counterparty = isCustomer ? delivery.driver : delivery.customer;
            document.getElementById('counterparty-name').textContent = counterparty
                ? `${counterparty.first_name} ${counterparty.last_name}`.trim() || counterparty.email
                : 'Awaiting driver assignment';
        }

        function messageBubble(m) {
            const mine = m.sender.id === user.id;
            return `
                <div class="flex flex-col gap-1 ${mine ? 'items-end ml-auto' : 'items-start'} max-w-[80%]">
                  <div class="${mine ? 'bg-primary text-white' : 'bg-surface-container-low border border-outline-variant text-on-surface'} p-3 rounded-tr-xl rounded-bl-xl rounded-br-xl">
                    <p class="text-body-sm font-body-sm">${m.text}</p>
                  </div>
                  <div class="flex items-center gap-2 px-1">
                    <span class="text-label-sm font-label-sm text-outline">${dateTime(m.created_at)}</span>
                  </div>
                </div>`;
        }

        function proposalCard(p) {
            return `
                <div class="flex flex-col gap-1 items-start max-w-[90%] w-full" data-proposal-id="${p.id}">
                  <div class="bg-surface-container-lowest border border-outline shadow-sm w-full md:w-[400px] rounded-lg overflow-hidden">
                    <div class="bg-surface-container-high px-4 py-2 border-b border-outline-variant flex justify-between items-center">
                      <span class="text-label-sm font-label-sm text-on-surface-variant">PRICE PROPOSAL</span>
                      <span class="text-label-sm font-label-sm text-on-surface-variant">${p.proposed_by.email}</span>
                    </div>
                    <div class="p-4 flex flex-col gap-4">
                      <div class="flex justify-between items-end">
                        <div>
                          <p class="text-label-sm font-label-sm text-outline uppercase tracking-wider">Proposed Rate</p>
                          <p class="text-headline-md font-headline-md text-primary">${money(p.amount)}</p>
                        </div>
                        <div class="text-right">
                          <p class="text-label-sm font-label-sm text-outline uppercase tracking-wider">Status</p>
                          <p class="text-body-md font-body-md text-secondary uppercase">${p.status}</p>
                        </div>
                      </div>
                      ${p.justification ? `<div class="p-3 bg-surface border border-outline-variant text-label-sm font-label-sm text-on-surface-variant italic rounded-lg">"${p.justification}"</div>` : ''}
                      ${p.status === 'pending' && p.proposed_by.id !== user.id
                ? `<div class="flex gap-2">
                             <button class="flex-grow py-2 border border-primary text-primary text-label-md font-label-md hover:bg-surface-container-low transition-colors active:opacity-80" onclick="declineProposal(${p.id})">Decline</button>
                             <button class="flex-grow py-2 bg-secondary-container text-on-secondary-container text-label-md font-label-md hover:brightness-95 transition-colors active:scale-[0.98]" onclick="acceptProposal(${p.id})">Accept Proposal</button>
                           </div>`
                : ''}
                    </div>
                  </div>
                  <span class="text-label-sm font-label-sm text-outline px-1">${dateTime(p.created_at)}</span>
                </div>`;
        }

        async function loadChat() {
            const [messages, proposals] = await Promise.all([
                API.deliveries.messages.list(deliveryId),
                API.deliveries.proposals.list(deliveryId),
            ]);
            const items = [
                ...messages.map((m) => ({ type: 'message', created_at: m.created_at, data: m })),
                ...proposals.map((p) => ({ type: 'proposal', created_at: p.created_at, data: p })),
            ].sort((a, b) => new Date(a.created_at) - new Date(b.created_at));

            const body = document.getElementById('chat-body');
            body.innerHTML = items.length
                ? items.map((item) => (item.type === 'message' ? messageBubble(item.data) : proposalCard(item.data))).join('')
                : `<div class="flex justify-center text-on-surface-variant text-label-sm">No messages yet — say hello.</div>`;
            body.scrollTop = body.scrollHeight;
        }

        async function sendMessage() {
            const text = textarea.value.trim();
            if (!text) return;
            await API.deliveries.messages.create(deliveryId, { text });
            textarea.value = '';
            textarea.style.height = 'auto';
            loadChat();
        }

        async function proposeRate() {
            const amount = await uiPrompt('What rate would you like to propose?', { title: 'Propose New Rate', placeholder: '0.00' });
            if (!amount) return;
            const justification = (await uiPrompt('Add a short justification for this rate (optional).', { title: 'Justification' })) || '';
            await API.deliveries.proposals.create(deliveryId, { amount: parseFloat(amount), justification });
            loadChat();
        }

        async function acceptProposal(id) {
            await API.deliveries.proposals.accept(deliveryId, id);
            delivery = await API.deliveries.get(deliveryId);
            renderSummary();
            loadChat();
        }

        async function declineProposal(id) {
            await API.deliveries.proposals.decline(deliveryId, id);
            loadChat();
        }

        document.getElementById('send-btn').addEventListener('click', sendMessage);
        textarea.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        async function load() {
            delivery = await API.deliveries.get(deliveryId);
            renderSummary();
            await loadChat();
        }

        load().catch((err) => uiAlert('Failed to load negotiation: ' + err.message, { kind: 'error' }));
    </script>
</body></html>
