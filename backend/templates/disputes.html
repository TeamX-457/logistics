<body class="bg-background text-on-surface">
<style>
  #app-loader{position:fixed;inset:0;z-index:9999;background:#131b2e;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .4s ease,visibility .4s ease;}
  #app-loader.app-loader-hidden{opacity:0;visibility:hidden;pointer-events:none;}
  #app-loader .loader-badge{width:72px;height:72px;border-radius:50%;animation:loader-pulse 1.6s ease-in-out infinite;}
  #app-loader .loader-name{margin-top:20px;font-family:'Geist',sans-serif;font-weight:700;font-size:22px;color:#ffffff;letter-spacing:-0.01em;}
  #app-loader .loader-tag{margin-top:6px;font-family:'Geist',sans-serif;font-size:11px;letter-spacing:.18em;color:#fea619;text-transform:uppercase;}
  #app-loader .loader-track{width:160px;height:3px;background:rgba(255,255,255,.15);overflow:hidden;border-radius:2px;margin-top:22px;}
  #app-loader .loader-fill{width:40%;height:100%;background:#fea619;border-radius:2px;animation:loader-slide 1.2s ease-in-out infinite;}
  @keyframes loader-slide{0%{transform:translateX(-100%);}50%{transform:translateX(60%);}100%{transform:translateX(220%);}}
  @keyframes loader-pulse{0%,100%{opacity:1;}50%{opacity:.75;}}
</style>
<div id="app-loader">
<img alt="Logistica" class="loader-badge" src="/static/img/logo-mark.svg"/>
<div class="loader-name">Logistica</div>
<div class="loader-tag">Loading</div>
<div class="loader-track"><div class="loader-fill"></div></div>
</div>

<aside class="h-screen w-64 fixed left-0 top-0 border-r border-outline-variant bg-surface-container-lowest flex flex-col py-lg px-md z-50">
<div class="mb-xl">
<div class="flex items-center gap-sm mb-1"><img alt="Logistica" class="w-7 h-7 rounded-full" src="/static/img/logo-mark.svg"/><h1 class="font-headline-md text-headline-md font-bold text-primary">Logistica</h1></div>
<p class="font-body-md text-body-sm text-on-surface-variant" id="profile-name">Loading…</p>
</div>
<nav class="flex-1 flex flex-col gap-xs">
<a class="flex items-center gap-md p-sm transition-colors duration-150 cursor-pointer active:opacity-80 text-on-surface-variant hover:text-primary hover:bg-surface-container" id="home-link" href="#">
<span class="material-symbols-outlined">dashboard</span>
<span class="font-body-md text-body-md">Dashboard</span>
</a>
<a class="flex items-center gap-md p-sm transition-colors duration-150 cursor-pointer active:opacity-80 text-on-surface-variant hover:text-primary hover:bg-surface-container" href="wallet">
<span class="material-symbols-outlined">payments</span>
<span class="font-body-md text-body-md">Wallet</span>
</a>
<a class="flex items-center gap-md p-sm transition-colors duration-150 cursor-pointer active:opacity-80 text-primary font-bold border-r-4 border-primary bg-surface-container-low" href="disputes">
<span class="material-symbols-outlined">gavel</span>
<span class="font-body-md text-body-md">Disputes</span>
</a>
</nav>
<a class="mt-auto bg-primary text-on-primary py-sm px-md font-label-md text-label-md flex items-center justify-center gap-sm" href="#" onclick="logout(); return false;">
            Log Out
        </a>
</aside>
<main class="ml-64 pt-16 min-h-screen bg-background">
<div class="px-gutter py-xl bg-surface-container-lowest border-b border-outline-variant flex items-center justify-between">
<h1 class="font-headline-lg text-headline-lg text-primary">Disputes</h1>
<button class="bg-secondary-container text-on-secondary-container px-lg py-sm font-label-md text-label-md flex items-center gap-sm" onclick="document.getElementById('new-dispute-form').classList.toggle('hidden')">
<span class="material-symbols-outlined">add</span> Raise Dispute
            </button>
</div>
<div class="px-gutter py-xl">
<form class="hidden bg-surface-container-lowest border border-outline-variant p-lg mb-xl grid grid-cols-2 gap-md" id="new-dispute-form">
<div>
<label class="block text-label-sm font-label-sm text-on-surface-variant mb-xs">DELIVERY ID</label>
<input class="w-full border border-outline-variant p-sm text-body-sm" id="nd_delivery" type="number"/>
</div>
<div>
<label class="block text-label-sm font-label-sm text-on-surface-variant mb-xs">PRIORITY</label>
<select class="w-full border border-outline-variant p-sm text-body-sm" id="nd_priority">
<option value="low">Low</option>
<option selected="" value="medium">Medium</option>
<option value="high">High</option>
<option value="critical">Critical</option>
</select>
</div>
<div class="col-span-2">
<label class="block text-label-sm font-label-sm text-on-surface-variant mb-xs">TITLE</label>
<input class="w-full border border-outline-variant p-sm text-body-sm" id="nd_title" placeholder="e.g. Cargo Damage Claim"/>
</div>
<div class="col-span-2">
<label class="block text-label-sm font-label-sm text-on-surface-variant mb-xs">DESCRIPTION</label>
<textarea class="w-full border border-outline-variant p-sm text-body-sm h-24" id="nd_description"></textarea>
</div>
<button class="col-span-2 bg-primary text-on-primary py-sm font-label-md text-label-md" onclick="createDispute()" type="button">Submit</button>
</form>
<div class="flex flex-col gap-md" id="disputes-list">
<div class="text-on-surface-variant">Loading…</div>
</div>
</div>
</main>
<script src="/static/js/config.js"></script>
<script src="/static/js/api.js"></script>
<script src="/static/js/auth.js"></script>
<script src="/static/js/ui.js"></script>
<script>
    const user = requireAuth();
    document.getElementById('home-link').href = ROLE_HOME[user.role] || '/';
    document.getElementById('profile-name').textContent = user.email;

    async function createDispute() {
      const payload = {
        delivery: parseInt(el("nd_delivery").value, 10),
        title: el("nd_title").value,
        description: el("nd_description").value,
        priority: el("nd_priority").value,
      };
      if (!payload.delivery || !payload.title) return uiAlert("Delivery ID and title are required.", { kind: 'error' });
      try {
        await API.disputes.create(payload);
        el("new-dispute-form").classList.add("hidden");
        await loadDisputes();
      } catch (err) {
        uiAlert("Failed to raise dispute: " + err.message, { kind: 'error' });
      }
    }

    async function loadDisputes() {
      const page = await API.disputes.list();
      const disputes = page.results || page;
      const list = el("disputes-list");
      list.innerHTML = disputes.length
        ? disputes
            .map(
              (d) => `
        <a href="dispute-detail?id=${d.id}" class="block bg-surface-container-lowest border border-outline-variant p-lg hover:border-primary transition-colors">
          <div class="flex items-center justify-between mb-xs">
            <span class="font-mono-sm text-mono-sm text-on-surface-variant">${d.case_id} &middot; delivery ${d.delivery_reference}</span>
            ${statusBadge(d.status)}
          </div>
          <div class="font-label-md text-label-md text-primary font-bold">${d.title}</div>
          <div class="text-label-sm text-on-surface-variant mt-xs">Raised by ${d.raised_by.email} &middot; priority: ${d.priority}</div>
        </a>`
            )
            .join("")
        : `<div class="text-on-surface-variant text-center py-xl">No disputes.</div>`;
    }

    loadDisputes().catch((err) => uiAlert("Failed to load disputes: " + err.message, { kind: 'error' }));
  </script>
</body>
</html>
