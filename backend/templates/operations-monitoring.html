        ::-webkit-scrollbar-thumb:hover { background: #bec6e0; }
    </style>
<script id="tailwind-config">

          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "primary-fixed-dim": "#bec6e0",
                      "surface-variant": "#d3e4fe",
                      "surface-container-highest": "#d3e4fe",
                      "surface": "#f8f9ff",

                      "secondary-fixed-dim": "#ffb95f",

                      "secondary": "#855300",

                      "outline-variant": "#c6c6cd",
                      "primary": "#000000",

                      "tertiary-fixed-dim": "#dec29a",
                      "tertiary-fixed": "#fcdeb5",

                      "inverse-on-surface": "#eaf1ff",
                      "outline": "#76777d",

                      "on-error-container": "#93000a",
                      "on-primary-container": "#7c839b",
                      "on-error": "#ffffff",

                      "surface-dim": "#cbdbf5",
                      "on-primary-fixed-variant": "#3f465c",

<body class="bg-background text-on-background font-body-md min-h-screen">
<style>
  #app-loader{position:fixed;inset:0;z-index:9999;background:#131b2e;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .4s ease,visibility .4s ease;}
  #app-loader.app-loader-hidden{opacity:0;visibility:hidden;pointer-events:none;}
  #app-loader .loader-badge{width:72px;height:72px;border-radius:50%;animation:loader-pulse 1.6s ease-in-out infinite;}
  #app-loader .loader-name{margin-top:20px;font-family:'Geist',sans-serif;font-weight:700;font-size:22px;color:#ffffff;letter-spacing:-0.01em;}
  #app-loader .loader-tag{margin-top:6px;font-family:'Geist',sans-serif;font-size:11px;letter-spacing:.18em;color:#fea619;text-transform:uppercase;}
  #app-loader .loader-track{width:160px;height:3px;background:rgba(255,255,255,.15);overflow:hidden;border-radius:2px;margin-top:22px;}
  #app-loader .loader-fill{width:40%;height:100%;background:#fea619;border-radius:2px;animation:loader-slide 1.2s ease-in-out infinite;}
  @keyframes loader-slide{0%{transform:translateX(-100%);}50%{transform:translateX(60%);}100%{transform:translateX(220%);}}
  @keyframes loader-pulse{0%,100%{opacity:1;}50%{opacity:.75;}}
</style>
<div id="app-loader">
<img alt="Logistica" class="loader-badge" src="/static/img/logo-mark.svg"/>
<div class="loader-name">Logistica</div>
<div class="loader-tag">Loading</div>
<div class="loader-track"><div class="loader-fill"></div></div>
</div>

<!-- TopNavBar (Fixed) -->
<!-- Main Content Canvas -->
<main class="pt-20 p-8 min-h-screen">
<div class="max-w-[1440px] mx-auto">
<!-- Header Section -->
<div class="flex justify-between items-end mb-8 flex-wrap gap-md">
<div>
<h1 class="font-headline-lg text-headline-lg text-primary">Global Delivery Monitoring</h1>
<p class="text-body-md text-on-surface-variant">Real-time oversight of logistics pipelines and active incident management.</p>
</div>
<div class="flex gap-sm flex-wrap">
<div class="flex items-center gap-2 bg-surface-container px-3 py-1.5 border border-outline-variant rounded">
<span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
<span class="text-label-sm font-label-sm uppercase" id="stat-active-deliveries">— Active Deliveries</span>
</div>
<div class="flex items-center gap-2 bg-error-container px-3 py-1.5 border border-error rounded">
<span class="w-2 h-2 rounded-full bg-error"></span>
<span class="text-label-sm font-label-sm uppercase text-on-error-container" id="stat-open-disputes">— Open Disputes</span>
</div>
</div>
</div>
<!-- Dashboard Grid -->
<div class="grid grid-cols-12 gap-lg h-auto lg:h-[800px]">
<!-- Left: Delivery List (Bento Column) -->
<div class="col-span-12 lg:col-span-4 flex flex-col gap-lg h-full">
<div class="bg-surface-container-lowest border border-outline-variant rounded-lg flex-grow flex flex-col overflow-hidden">
<div class="p-4 border-b border-outline-variant flex justify-between items-center bg-surface-container-low">
<h2 class="text-label-md font-label-md">Active Deliveries</h2>
</div>
<div class="overflow-y-auto flex-grow" id="active-deliveries-list">
<div class="p-4 text-on-surface-variant text-body-sm">Loading…</div>
</div>
</div>
</div>
<!-- Middle/Right: Dispute Handling (The Detail View) -->
<div class="col-span-12 lg:col-span-8 flex flex-col gap-lg h-full">
<!-- Top Section: Dispute Queue -->
<section class="bg-surface-container-lowest border border-error rounded-lg dispute-gradient p-6">
<div class="flex items-center gap-3 mb-4">
<span class="material-symbols-outlined text-error" style="font-variation-settings: 'FILL' 1;">warning</span>
<h2 class="text-headline-md font-headline-md text-error">Priority Dispute Queue</h2>
</div>
<div class="flex gap-md overflow-x-auto pb-2" id="dispute-queue">
<div class="text-on-surface-variant text-body-sm">Loading…</div>
</div>
</section>
</div>
</div>
</div>
</main>
<script src="/static/js/config.js"></script>
    <script src="/static/js/api.js"></script>
    <script src="/static/js/auth.js"></script>
    <script src="/static/js/ui.js"></script>
    <script>
        const user = requireAuth(['admin']);
        renderAppShell('operations-monitoring', { title: 'Operations' });

        async function loadActiveDeliveries() {
            const page = await API.deliveries.list({ ordering: '-created_at' });
            const deliveries = (page.results || page).filter((d) =>
                ['accepted', 'driver_arrived', 'in_transit', 'delayed', 'negotiating', 'pending'].includes(d.status)
            );
            const list = document.getElementById('active-deliveries-list');
            list.innerHTML = deliveries.length
                ? deliveries
                    .map((d) => `
                <div class="p-4 border-b border-outline-variant hover:bg-surface-container transition-colors cursor-pointer ${d.status === 'delayed' ? 'bg-error-container/20 border-l-4 border-l-error' : ''}" onclick="window.location.href='live-tracking?id=${d.id}'">
                  <div class="flex justify-between items-start mb-2">
                    <span class="text-mono-sm font-mono-sm ${d.status === 'delayed' ? 'text-error' : 'text-outline'}">${d.reference}</span>
                    ${statusBadge(d.status)}
                  </div>
                  <p class="text-label-md font-label-md text-on-surface mb-1">${d.pickup_address} &rarr; ${d.dropoff_address}</p>
                  <div class="flex justify-between items-center text-body-sm text-on-surface-variant">
                    <span>${d.package_type.replace(/_/g, ' ')}</span>
                    <span>${money(d.target_price)}</span>
                  </div>
                </div>`)
                    .join('')
                : `<div class="p-4 text-on-surface-variant text-body-sm">No active deliveries right now.</div>`;
        }

        async function loadDisputeQueue() {
            const page = await API.disputes.list();
            const disputes = (page.results || page).filter((d) => d.status !== 'resolved');
            const queue = document.getElementById('dispute-queue');
            queue.innerHTML = disputes.length
                ? disputes
                    .map((d) => `
                <div class="min-w-[280px] bg-white border border-outline-variant rounded p-4 shadow-sm hover:border-error transition-colors cursor-pointer" onclick="window.location.href='dispute-detail?id=${d.id}'">
                  <div class="flex justify-between mb-2">
                    <span class="text-mono-sm font-mono-sm text-outline">${d.case_id}</span>
                    <span class="text-label-sm font-label-sm text-error">${d.priority}</span>
                  </div>
                  <p class="text-label-md font-label-md mb-3">${d.title}</p>
                  <div class="flex items-center gap-2">
                    <span class="text-body-sm">Raised by ${d.raised_by.email}</span>
                  </div>
                </div>`)
                    .join('')
                : `<div class="text-on-surface-variant text-body-sm">No open disputes right now.</div>`;
        }

        async function loadStats() {
            const data = await API.dashboard.operationsMonitoring();
            document.getElementById('stat-active-deliveries').textContent = `${data.active_deliveries_count} Active Deliveries`;
            document.getElementById('stat-open-disputes').textContent = `${data.open_disputes_count} Open Disputes`;
        }

        Promise.all([loadStats(), loadActiveDeliveries(), loadDisputeQueue()]).catch((err) =>
            uiAlert('Failed to load operations monitoring: ' + err.message, { kind: 'error' })
        );
    </script>
</body></html>
