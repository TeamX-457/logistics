<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>500 | Logistica</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="/static/favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #f8f9ff; font-family: 'Geist', sans-serif; color: #0b1c30;
  }
  .card { text-align: center; padding: 48px 32px; max-width: 480px; }
  .badge { width: 72px; height: 72px; border-radius: 50%; margin: 0 auto 24px; display: block; }
  .code { font-size: 72px; font-weight: 700; color: #131b2e; letter-spacing: -0.02em; margin: 0; line-height: 1; }
  .title { font-size: 20px; font-weight: 600; color: #131b2e; margin: 12px 0 8px; }
  .desc { font-size: 15px; color: #45464d; margin: 0 0 28px; line-height: 1.5; }
  .actions { display: flex; gap: 12px; justify-content: center; }
  .btn { display: inline-block; background: #131b2e; color: #ffffff; text-decoration: none; padding: 12px 28px; border-radius: 8px; font-weight: 600; font-size: 14px; border: none; cursor: pointer; font-family: inherit; }
  .btn:hover { opacity: .9; }
  .btn-ghost { background: #ffffff; color: #131b2e; border: 1px solid #c6c6cd; }
  .accent { color: #fea619; }
</style>
</head>
<body>
<div class="card">
<img src="/static/img/logo-mark.svg" alt="Logistica" class="badge">
<p class="code">500<span class="accent">.</span></p>
<h1 class="title">Something Went Wrong</h1>
<p class="desc">Our servers hit a snag on our end. We've logged it and we're on it — please try again in a moment.</p>
<div class="actions">
<button class="btn btn-ghost" onclick="window.location.reload()">Try Again</button>
<a class="btn" href="/">Back to Logistica</a>
</div>
</div>
</body>
</html>
